name: Build APK

# - Cada push a main  → compila y actualiza la pre-release "build-latest"
#                        (enlace fijo: /releases/download/build-latest/aurum-fit.apk)
# - Cada tag vX.Y.Z   → compila y crea una Release oficial marcada como "latest"
#                        (enlace fijo: /releases/latest/download/aurum-fit.apk)
# - Pull requests     → solo compila y prueba, no publica nada.
on:
  push:
    branches: [main, "dev/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.x"
  APK_NAME: aurum-fit.apk

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Versión
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            BASE=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
            NAME="${BASE}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Versión: $NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Dependencias
        run: flutter pub get

      # Los errores se publican también como anotaciones de GitHub para
      # verlos en la pestaña "Summary" (y por la API) sin abrir el log.
      - name: Análisis estático
        shell: bash
        run: |
          set +e
          dart analyze --format=machine --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          errors=$(grep -c '^ERROR|' analyze.txt)
          grep '^ERROR|' analyze.txt | head -45 | while IFS='|' read -r sev type rule file line col len msg; do
            echo "::error file=${file#$GITHUB_WORKSPACE/},line=$line,col=$col::$rule: $msg"
          done
          if [ $code -ne 0 ] && [ "$errors" = "0" ]; then
            head -15 analyze.txt | while read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - name: Tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            grep -nE "Expected:|Actual:|Error:|\[E\]|error:" test.txt | head -20 | while read -r l; do echo "::error::${l}"; done
          fi
          exit $code

      # La firma es opcional. Sin estos secrets el APK se firma con la clave
      # debug del runner (instala, pero no actualiza encima de builds previos).
      - name: Configurar firma de release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK se firmará con la clave debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      # PROXY_URL no es secreto (va dentro del APK), pero se guarda como
      # Secret/Variable para no dejarlo fijo en el código.
      - name: Compilar APK
        shell: bash
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "::warning::Sin PROXY_URL: la app usará solo el generador local de planes."
          fi
          set -o pipefail
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.number }}" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=PROXY_URL="$PROXY_URL" 2>&1 | tee build.txt || {
              grep -nE -A2 "error:|Error:|e: |What went wrong|> .*failed|Could not|requires" build.txt | head -20 | while read -r l; do echo "::error::${l}"; done
              exit 1
            }
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Limpiar secretos de firma
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: aurum-fit-${{ steps.version.outputs.name }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          retention-days: 30

      - name: Guardar símbolos de depuración
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ steps.version.outputs.name }}
          path: build/symbols
          retention-days: 90

      - name: Publicar pre-release build-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-latest --cleanup-tag --yes || true
          gh release create build-latest "$APK_NAME" "$APK_NAME.sha256" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Build ${{ steps.version.outputs.name }}" \
            --notes "Compilación automática del commit ${GITHUB_SHA::7}. Descarga directa: https://github.com/${GITHUB_REPOSITORY}/releases/download/build-latest/${APK_NAME}"

      - name: Publicar release oficial
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" "$APK_NAME.sha256" \
            --title "Aurum Fit $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
